<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sombra en texto CSS</title>
  <style>
    .texto-sombra {
      font-size: 24px;
      font-family: Arial, sans-serif;
      color: rgb(30, 28, 150);
      text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>

  <p class="texto-sombra">Este es un párrafo de texto con una sombra suave aplicada mediante CSS.</p>

</body>
</html>
