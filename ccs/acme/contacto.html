<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto ACME</title>
</head>
<body>
    <h1>Rellena la informacion para contactar con nosotros.</h1>
<form>
    <fieldset >
  <div class="campo">
    <label for="nombre">Nombre Completo:</label>
    <input type="text" id="nombre" name="nombre">
  </div>
</fieldset>
<fieldset >
    <div>
        <lable for="User">Usuario:</lable>
        <input type="text" id="Usuario">
    </div>
</fieldset>
<fieldset >
 <div>
    <label>Correo electronico:</label>
        <input type="email" id="Correo electronico">
 </div>
</fieldset>
<fieldset >
 <div class="campo">
         <label>Contraseña:</label>
         <input type="text" id="Contraseña">

 </div>
</fieldset>
<fieldset >
 <div class="campo">
         <label>Telefono:</label>
         <input type="number" id="Telefono">

 </div>
</fieldset>
<fieldset >
  <div class="seccion-encuesta">
    <label>¿Cómo evaluarías nuestro servicio?</label>
    <select name="evaluacion">
      <option value="bueno">Bueno</option>
      <option value="regular">Regular</option>
      <option value="malo">Malo</option>
    </select>
  </div>
</fieldset>
<fieldset>
    <legend>Completa para ayudarte</legend>
    <textarea name="texto1" rows="5" cols="53">Por favor, escriba aquí para saber que necesita.</textarea>
</fieldset>
</form>
    <a href="inicio.html">Inicio</a>
</body>
</html>
