<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio de formularios</title>
</head>
<body>

    <h1>Ejercicio de formularios</h1>

    <!-- FORMULARIO 1 -->
    <h2>Formulario 1</h2>
    <form action="#" method="get">
        <fieldset>
            <legend>Completar</legend>
            
            <p>
                <label for="color">Elija un color:</label>
                <input type="color" id="color" name="color">
            </p>

            <p>
                <textarea name="texto1" rows="5" cols="53">Por favor, escriba aquí</textarea>
            </p>

            <p>
                <select name="lenguaje">
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                    <option value="html">HTML</option>
                    <option value="visual_basic">Visual Basic</option>
                </select>
            </p>

            <p>
                <input type="checkbox" id="asir" name="ciclo" value="cicloasir">
                <label for="asir">ASIR</label>
                
                <input type="checkbox" id="dam" name="ciclo" value="ciclodam">
                <label for="dam">DAM</label>
                
                <input type="checkbox" id="daw" name="ciclo" value="ciclodaw">
                <label for="daw">DAW</label>
            </p>
        </fieldset>

        <fieldset>
            <legend>Rellene las opciones siguientes</legend>
            
            <p>
                <label for="fecha">Elija una fecha:</label>
                <input type="date" id="fecha" name="fecha">
            </p>

            <p>
                <label for="fichero">Elija un fichero:</label>
                <input type="file" id="fichero" name="fichero">
            </p>

            <p>
                <select name="ciclo" multiple>
                    <option value="smir">SMIR</option>
                    <option value="asir">ASIR</option>
                    <option value="dam">DAM</option>
                    <option value="daw">DAW</option>
                </select>
            </p>
        </fieldset>
    </form>

    <hr>

    <!-- FORMULARIO 2 -->
    <h2>Formulario 2</h2>
    <form action="#" method="get">
        <fieldset>
            <legend>Rellenar</legend>
            
            <p>
                <input type="radio" id="lengua" name="asignatura" value="asignaturalengua">
                <label for="lengua">Lengua</label><br>
                
                <input type="radio" id="matematicas" name="asignatura" value="asignaturamatematicas">
                <label for="matematicas">Matemáticas</label><br>
                
                <input type="radio" id="historia" name="asignatura" value="asignaturahistoria">
                <label for="historia">Historia</label><br>
                
                <input type="radio" id="geografia" name="asignatura" value="asignaturageografia">
                <label for="geografia">Geografía</label>
            </p>

            <p>
                <input type="checkbox" id="notepad" name="editor" value="editornotepad">
                <label for="notepad">Notepad</label>
                
                <input type="checkbox" id="emacs" name="editor" value="editoremacs">
                <label for="emacs">Emacs</label>
                
                <input type="checkbox" id="otro" name="editor" value="editorotro">
                <label for="otro">Otro</label>
            </p>

            <p>
                <textarea name="texto2" rows="5" cols="59">Escriba aquí, por favor</textarea>
            </p>

            <p>
                <select name="procesador">
                    <option value="amd">AMD</option>
                    <option value="intel_i5">Intel i5</option>
                    <option value="intel_i7">Intel i7</option>
                </select>
            </p>
        </fieldset>
    </form>

    <hr>

    <!-- FORMULARIO 3 -->
    <h2>Formulario 3</h2>
    <form action="#" method="get">
        <fieldset>
            <legend>Rellenar</legend>
            
            <p>
                <input type="radio" id="geo3" name="asignatura" value="asignaturageografia">
                <label for="geo3">Geografía</label>
                
                <input type="radio" id="len3" name="asignatura" value="asignaturalengua">
                <label for="len3">Lengua</label>
                
                <input type="radio" id="mat3" name="asignatura" value="asignaturamatematicas">
                <label for="mat3">Matemáticas</label>
                
                <input type="radio" id="his3" name="asignatura" value="asignaturahistoria">
                <label for="his3">Historia</label>
            </p>

            <p>
                <label for="hora">Elija una hora:</label>
                <input type="time" id="hora" name="hora">
            </p>

            <p>
                <input type="checkbox" id="espanol" name="idioma" value="idiomaespanol">
                <label for="espanol">Español</label><br>
                
                <input type="checkbox" id="ingles" name="idioma" value="idiomaingles">
                <label for="ingles">Inglés</label><br>
                
                <input type="checkbox" id="aleman" name="idioma" value="idiomaaleman">
                <label for="aleman">Alemán</label><br>
                
                <input type="checkbox" id="francés" name="idioma" value="idiomafrancès">
                <label for="francés">Francés</label>
            </p>

            <p>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre"><br><br>
                
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" name="apellidos">
            </p>
        </fieldset>
    </form>

</body>
</html>
